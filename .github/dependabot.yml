version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - 'eslint-config-next'
          - '@types/react'
          - '@types/react-dom'
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
      storybook-vitest:
        patterns:
          - 'storybook'
          - '@storybook/*'
          - 'vitest'
          - '@vitest/*'
          - 'playwright'
          - '@chromatic-com/storybook'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'prettier-plugin-tailwindcss'
          - 'tw-animate-css'
      tooling:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'prettier'
          - 'typescript'
          - 'husky'
          - 'lint-staged'
          - 'cypress'
          - '@types/node'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
